<!DOCTYPE html>
<html lang="pt-BR"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Link expirado | MinUrl</title>
</head>

<body>
<div layout:fragment="content">

  <section class="error-page">

    <div class="error-visual">

      <div class="error-icon expired-icon">
        <i class="bi bi-clock-history" aria-hidden="true"></i>
      </div>

      <span class="expired-label">EXPIRADO</span>

    </div>

    <h1>O tempo desse link acabou!</h1>

    <p class="error-description">
      Este link não está mais disponível porque sua data de expiração
      foi atingida. Mas não se preocupe, você pode voltar ao MinUrl
      e criar um novo link quando precisar.
    </p>

    <div class="error-actions">
      <a th:href="@{/}" class="error-home-button">
        <i class="bi bi-house-door" aria-hidden="true"></i>
        Voltar ao início
      </a>
    </div>

  </section>

</div>
</body>
</html>
