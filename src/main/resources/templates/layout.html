
<!DOCTYPE html>
<html lang="pt-BR"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MinUrl - Encurte seus links</title>

    <link rel="stylesheet"
          th:href="@{/webjars/bootstrap/5.3.3/css/bootstrap.min.css}">
    <link rel="stylesheet"
          th:href="@{/webjars/bootstrap-icons/1.13.1/font/bootstrap-icons.min.css}">
    <link rel="stylesheet"
          th:href="@{/css/styles.css}">
</head>

<body class="minurl-body">

<nav class="navbar navbar-expand-md navbar-dark minurl-navbar sticky-top">
    <div class="container navbar-container">

        <a class="navbar-brand minurl-brand" th:href="@{/}">
            <i class="bi bi-link-45deg brand-icon" aria-hidden="true"></i>
            <span class="brand-name">Min<span>Url</span></span>
        </a>

        <button class="navbar-toggler" type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarNav"
                aria-controls="navbarNav"
                aria-expanded="false"
                aria-label="Abrir menu de navegação">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav minurl-nav">

                <li class="nav-item">
                    <a class="nav-link" th:classappend="${activeHome == true ? 'nav-link-active' : ''}" th:href="@{/}">
                        <i class="bi bi-house nav-icon"></i>
                        Início
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" th:classappend="${activeStats == true ? 'nav-link-active' : ''}" th:href="@{/stats}">
                        <i class="bi bi-graph-up nav-icon"></i>
                        Estatísticas
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" th:classappend="${activeAbout == true ? 'nav-link-active' : ''}" th:href="@{/about}">
                        <i class="bi bi-archive nav-icon"></i>
                        Sobre
                    </a>
                </li>

            </ul>
        </div>

    </div>
</nav>

<main class="container minurl-main">

    <div th:if="${successMessage}"
         class="alert alert-success alert-dismissible fade show minurl-alert"
         role="alert">

        <strong>Sucesso!</strong>
        <span th:text="${successMessage}"></span>

        <button type="button" class="btn-close"
                data-bs-dismiss="alert"
                aria-label="Fechar mensagem"></button>
    </div>

    <div th:if="${errorMessage}"
         class="alert alert-danger alert-dismissible fade show minurl-alert"
         role="alert">

        <strong>Atenção!</strong>
        <span th:text="${errorMessage}"></span>

        <button type="button" class="btn-close"
                data-bs-dismiss="alert"
                aria-label="Fechar mensagem"></button>
    </div>

    <div layout:fragment="content"></div>

</main>


<footer class="minurl-footer">
    <div class="container">

        <div class="footer-top">
            <div class="footer-brand-group">
                <a class="footer-brand" th:href="@{/}">
                    Min<span>Url</span>
                </a>
            </div>

            <a href="https://github.com/luiz-jacson/minurl"
               class="footer-github"
               target="_blank"
               rel="noopener noreferrer">

                <i class="bi bi-github" aria-hidden="true"></i>
                <span>Código-fonte</span>
                <i class="bi bi-arrow-up-right"
                   aria-hidden="true"></i>
            </a>
        </div>

        <div class="footer-bottom">
            <p>
                © <span th:text="${#dates.year(#dates.createNow())}">2026</span>
                <strong>MinUrl</strong>
                <span class="footer-separator">·</span>
                Projeto de portfólio
            </p>
        </div>

    </div>
</footer>


<script th:src="@{/webjars/bootstrap/5.3.3/js/bootstrap.bundle.min.js}"></script>

</body>
</html>
