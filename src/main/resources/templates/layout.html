
<!DOCTYPE html>
<html lang="pt-BR"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MinUrl | Encurtador de URLs</title>

    <link rel="stylesheet"
          th:href="@{/webjars/bootstrap/5.3.3/css/bootstrap.min.css}">

    <link rel="stylesheet"
          th:href="@{/css/styles.css}">
</head>

<body class="minurl-body">

<nav class="navbar navbar-expand-md navbar-dark minurl-navbar sticky-top">
    <div class="container navbar-container">

        <a class="navbar-brand minurl-brand" th:href="@{/}">
            <span class="brand-icon" aria-hidden="true">🔗</span>
            <span class="brand-name">Min<span>Url</span></span>
        </a>

        <button class="navbar-toggler" type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarNav"
                aria-controls="navbarNav"
                aria-expanded="false"
                aria-label="Abrir menu de navegação">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav minurl-nav">

                <li class="nav-item">
                    <a class="nav-link nav-link-active" th:href="@{/}">
                        <span class="nav-icon" aria-hidden="true">⌂</span>
                        Início
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" th:href="@{/admin}">
                        <span class="nav-icon" aria-hidden="true">🛡</span>
                        Estatísticas
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" th:href="@{/about}">
                        <span class="nav-icon" aria-hidden="true">▤</span>
                        Sobre
                    </a>
                </li>

            </ul>
        </div>

    </div>
</nav>

<main class="container minurl-main">

    <div th:if="${successMessage}"
         class="alert alert-success alert-dismissible fade show minurl-alert"
         role="alert">

        <strong>Sucesso!</strong>
        <span th:text="${successMessage}"></span>

        <button type="button" class="btn-close"
                data-bs-dismiss="alert"
                aria-label="Fechar mensagem"></button>
    </div>

    <div th:if="${errorMessage}"
         class="alert alert-danger alert-dismissible fade show minurl-alert"
         role="alert">

        <strong>Atenção!</strong>
        <span th:text="${errorMessage}"></span>

        <button type="button" class="btn-close"
                data-bs-dismiss="alert"
                aria-label="Fechar mensagem"></button>
    </div>

    <div layout:fragment="content"></div>

</main>

<footer class="minurl-footer">
    <div class="container text-center">
        <a class="footer-brand" th:href="@{/}">
            Min<span>Url</span>
        </a>

    </div>
</footer>

<script th:src="@{/webjars/bootstrap/5.3.3/js/bootstrap.bundle.min.js}"></script>

</body>
</html>
